version: '3.3'
# サービスの定義
services:
  webserver:
    image: ubuntu:22.04
    build: .
    depends_on:
      - db
      - redis
    command: /bin/bash
    ports:
      - "80:80"
    networks:
      - webnet
  redis:
    image: redis
    networks:
      - webnet
  db:
    image: postgres

# ネットワーク定義
networks:
  webnet:

# データボリューム定義
volumes:
  data-volume: